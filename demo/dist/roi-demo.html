<style>
/* ROI Marcel Assaraf — demo
   World: the lit marble-and-brass sign of the salon. Espresso black ground,
   brass for action and selection, marble only where the brand speaks. */

:root {
  --ground: #0E0B08;
  --ground-2: #15100C;         /* rails, toolbars */
  --surface: #1B1510;
  --surface-2: #241C15;
  --line: rgba(214, 170, 96, .16);
  --line-strong: rgba(214, 170, 96, .34);
  --ink: #F2E7D5;
  --ink-2: #C7B697;
  --ink-3: #9C8B70;
  --brass: #D2A24C;
  --brass-hi: #E9C47F;
  --brass-ink: #1A1108;        /* text on brass */
  --brass-soft: rgba(210, 162, 76, .14);
  --brass-wash: rgba(210, 162, 76, .07);
  --ok: #7FB98A;
  --warn: #E1A84B;
  --danger: #E07A6A;
  --wait: rgba(210, 162, 76, .10);
  --shadow: 0 10px 30px -12px rgba(0,0,0,.65), 0 2px 6px -2px rgba(0,0,0,.4);
  --radius: 14px;
  --radius-sm: 10px;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --font: "Assistant", system-ui, sans-serif;
  --font-title: "Frank Ruhl Libre", "Assistant", serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --ground: #F3ECE1;
  --ground-2: #EAE0D1;
  --surface: #FFFCF7;
  --surface-2: #F7F0E5;
  --line: rgba(110, 76, 30, .14);
  --line-strong: rgba(110, 76, 30, .30);
  --ink: #24180C;
  --ink-2: #5B4630;
  --ink-3: #7A644A;
  --brass: #8E5F17;
  --brass-hi: #A8731F;
  --brass-ink: #FFF8EC;
  --brass-soft: rgba(142, 95, 23, .12);
  --brass-wash: rgba(142, 95, 23, .06);
  --ok: #2F7A43;
  --warn: #9A6410;
  --danger: #B3402F;
  --wait: rgba(142, 95, 23, .08);
  --shadow: 0 12px 28px -14px rgba(60, 38, 10, .35), 0 2px 6px -3px rgba(60, 38, 10, .2);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  background: var(--ground);
  color: var(--ink);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--brass); color: var(--brass-ink); }
:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 2px; border-radius: 6px; }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brass-hi); text-underline-offset: 3px; }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 16px; height: 16px; }
.ic.lg { width: 26px; height: 26px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- demo bar ---------- */
.demo-bar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 12px;
  padding: 8px 16px;
  background: var(--ground-2);
  border-bottom: 1px solid var(--line);
}
.demo-tag { font-size: 13px; color: var(--ink-3); margin-inline-end: auto; white-space: nowrap; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--ink-2); transition: background .2s var(--ease), color .2s; }
.seg button[aria-selected="true"] { background: var(--brass); color: var(--brass-ink); }
.seg button:hover:not([aria-selected="true"]) { color: var(--ink); }
.icon-btn { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); }
.icon-btn:hover { color: var(--ink); border-color: var(--line-strong); }
@media (max-width: 520px) { .demo-tag { display: none; } .seg button { padding: 6px 10px; font-size: 13px; } .demo-bar { justify-content: space-between; } }

/* ---------- buttons & controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 20px; border-radius: 12px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-weight: 700; font-size: 16px; text-decoration: none;
  transition: background .2s var(--ease), border-color .2s, transform .15s var(--ease), opacity .2s;
}
.btn:hover { border-color: var(--brass); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); }
.btn.primary:hover { background: var(--brass-hi); border-color: var(--brass-hi); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { color: var(--ink); background: var(--brass-wash); }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 10px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.btn.loading { pointer-events: none; }
.btn.loading::after { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-inline-end-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.field { display: grid; gap: 6px; }
.field > span { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.input, .select, textarea.input {
  width: 100%; min-height: 48px; padding: 10px 14px;
  background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 12px;
  transition: border-color .2s, box-shadow .2s;
}
textarea.input { min-height: 88px; resize: vertical; }
.input::placeholder { color: var(--ink-3); }
.input:focus, .select:focus { outline: none; border-color: var(--brass); box-shadow: 0 0 0 3px var(--brass-soft); }
.input[aria-invalid="true"] { border-color: var(--danger); }
.hint { font-size: 13px; color: var(--ink-3); }
.err { font-size: 13px; color: var(--danger); }

.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px;
  border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; font-weight: 600; font-size: 14px; color: var(--ink-2);
}
.chip:hover { color: var(--ink); border-color: var(--brass); }
.chip[aria-pressed="true"] { background: var(--brass-soft); border-color: var(--brass); color: var(--ink); }

.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }
.switch { position: relative; width: 46px; height: 28px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line-strong); flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink-3); transition: inset-inline-start .2s var(--ease), background .2s; }
.switch[aria-checked="true"] { background: var(--brass); border-color: var(--brass); }
.switch[aria-checked="true"]::after { inset-inline-start: 21px; background: var(--brass-ink); }

/* ---------- client shell ---------- */
.client { max-width: 460px; margin: 0 auto; min-height: calc(100dvh - 55px); display: flex; flex-direction: column; position: relative; }
.client main { flex: 1; padding: 0 16px 112px; }
.client.booking main { padding-bottom: 210px; }
.tabbar {
  position: fixed; bottom: 0; inset-inline: 0; z-index: 30;
  display: flex; justify-content: center;
  background: var(--ground-2);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar nav { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; max-width: 460px; }
.tabbar button { display: grid; justify-items: center; gap: 2px; padding: 10px 4px 12px; border: 0; background: none; color: var(--ink-3); font-size: 12px; font-weight: 600; }
.tabbar button[aria-current="page"] { color: var(--brass-hi); }
.tabbar button:hover { color: var(--ink); }

.screen-head { display: flex; align-items: center; gap: 8px; padding: 16px 0 8px; }
.screen-head h1 { font-family: var(--font-title); font-weight: 700; font-size: 26px; line-height: 1.15; margin: 0; letter-spacing: -.01em; }
.screen-head .back { margin-inline-start: -8px; }
.sub { color: var(--ink-2); margin: 0; }

/* home hero: the sign */
.sign { position: relative; margin: 0 -16px; padding: 28px 16px 22px; display: grid; justify-items: center; text-align: center; overflow: hidden; }
.sign::before { content: ""; position: absolute; inset: -40% -20% auto; height: 420px; background: radial-gradient(closest-side, rgba(233,170,80,.22), transparent 70%); pointer-events: none; }
:root[data-theme="light"] .sign::before { background: radial-gradient(closest-side, rgba(180,120,40,.18), transparent 70%); }
.sign img { width: 196px; height: 196px; border-radius: 50%; position: relative; box-shadow: 0 0 0 1px var(--line-strong), 0 18px 50px -18px rgba(233,170,80,.55); }
.sign p { position: relative; margin: 14px 0 0; color: var(--ink-2); font-size: 15px; }

.next-appt {
  border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line-strong);
  background: var(--surface);
}

.next-appt .body { padding: 16px; display: grid; gap: 10px; }
.next-appt h2 { margin: 0; font-size: 20px; font-weight: 800; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-2); font-size: 15px; }
.meta span { display: inline-flex; align-items: center; gap: 6px; }

.cta-book { margin: 18px 0 8px; }
.section { margin-top: 28px; }
.section > h2 { font-size: 18px; font-weight: 800; margin: 0 0 12px; }
.row-link {
  display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 0; border: 0; border-bottom: 1px solid var(--line);
  background: none; text-align: start;
}
.row-link:hover .title { color: var(--brass-hi); }
.row-link .title { font-weight: 700; font-size: 16px; transition: color .2s; }
.row-link .desc { font-size: 14px; color: var(--ink-3); }
.row-link .chev { margin-inline-start: auto; color: var(--ink-3); }
.avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; flex: none; border: 1px solid var(--line-strong); background: var(--surface-2); display: grid; place-items: center; color: var(--ink-3); }
.avatar.lg { width: 88px; height: 88px; }
.mono-mark { font-family: var(--font-title); font-weight: 900; color: var(--brass); font-size: 18px; }

.contact { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.addr { font-size: 14px; color: var(--ink-3); margin-top: 8px; }

/* ---------- booking ---------- */
.steps { display: flex; gap: 6px; margin: 6px 0 18px; }
.steps i { flex: 1; height: 3px; border-radius: 3px; background: var(--line-strong); }
.steps i.on { background: var(--brass); }

.cat { margin: 22px 0 6px; font-size: 14px; font-weight: 700; color: var(--ink-3); }
.svc {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center;
  width: 100%; padding: 14px; margin-bottom: 8px; text-align: start;
  border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface);
  transition: border-color .2s, background .2s;
}
.svc:hover { border-color: var(--line-strong); }
.svc[aria-pressed="true"] { border-color: var(--brass); background: var(--brass-wash); }
.svc .name { font-weight: 700; }
.svc .price { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.svc .price small { font-weight: 500; color: var(--ink-3); font-size: 12px; margin-inline-end: 4px; }
.svc .dur { grid-column: 1 / -1; font-size: 13px; color: var(--ink-3); display: flex; gap: 10px; align-items: center; }
.svc .tick { display: none; }
.svc[aria-pressed="true"] .tick { display: inline-flex; color: var(--brass-hi); }
.svc.consult { border-style: dashed; }

/* the signature: chair-time ribbon */
.ribbon { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; }
.ribbon b { display: block; height: 100%; background: var(--brass); border-radius: 2px; }
.ribbon b.p { background: transparent; border: 1px dashed var(--brass); opacity: .9; }
.ribbon-legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); margin-top: 8px; flex-wrap: wrap; }
.ribbon-legend span { display: inline-flex; align-items: center; gap: 6px; }
.ribbon-legend i { width: 14px; height: 8px; border-radius: 2px; background: var(--brass); display: inline-block; }
.ribbon-legend i.p { background: transparent; border: 1px dashed var(--brass); }

.dock {
  position: fixed; bottom: 0; inset-inline: 0; z-index: 35; display: flex; justify-content: center;
  background: var(--ground-2); border-top: 1px solid var(--line-strong); box-shadow: 0 -12px 30px -18px rgba(0,0,0,.5);
  padding-bottom: env(safe-area-inset-bottom);
}
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.dock .in { width: 100%; max-width: 460px; padding: 12px 16px 14px; display: grid; gap: 10px; }
.dock .sum { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.dock .sum strong { font-size: 18px; font-variant-numeric: tabular-nums; }
.dock .sum span { color: var(--ink-2); font-size: 14px; }
.note-line { font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }

.stylist-card {
  display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px; text-align: start; margin-bottom: 10px;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
}
.stylist-card[aria-pressed="true"] { border-color: var(--brass); background: var(--brass-wash); }
.stylist-card:hover { border-color: var(--line-strong); }
.stylist-card[disabled] { opacity: .5; cursor: not-allowed; }

.days { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; margin: 0 -16px; padding-inline: 16px; scroll-snap-type: x mandatory; }
.day {
  flex: none; width: 60px; padding: 10px 0; display: grid; justify-items: center; gap: 2px; scroll-snap-align: start;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
}
.day .dn { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.day .dd { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.day .dm { font-size: 11px; color: var(--ink-3); }
.day[aria-pressed="true"] { background: var(--brass); border-color: var(--brass); }
.day[aria-pressed="true"] .dn, .day[aria-pressed="true"] .dd, .day[aria-pressed="true"] .dm { color: var(--brass-ink); }
.day[disabled] { opacity: .38; cursor: not-allowed; }
.day:hover:not([disabled]):not([aria-pressed="true"]) { border-color: var(--brass); }

.slot-group h3 { font-size: 14px; color: var(--ink-3); font-weight: 700; margin: 18px 0 8px; }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.slot { min-height: 44px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 700; font-variant-numeric: tabular-nums; }
.slot:hover { border-color: var(--brass); }
.slot[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); }

.empty {
  border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 20px; display: grid; gap: 10px; text-align: center; justify-items: center;
  color: var(--ink-2);
}
.empty strong { color: var(--ink); font-size: 17px; }

.panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 16px; }
.panel + .panel { margin-top: 12px; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-weight: 700; text-align: end; font-variant-numeric: tabular-nums; }
dl { margin: 0; }

.upload { display: flex; gap: 8px; flex-wrap: wrap; }
.upload label { width: 76px; height: 76px; border-radius: 12px; border: 1px dashed var(--line-strong); display: grid; place-items: center; color: var(--ink-3); cursor: pointer; }
.upload label:hover { border-color: var(--brass); color: var(--ink); }
.upload img { width: 76px; height: 76px; border-radius: 12px; object-fit: cover; border: 1px solid var(--line-strong); }

.success { text-align: center; padding-top: 28px; display: grid; justify-items: center; gap: 10px; }
.seal { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: var(--brass); color: var(--brass-ink); box-shadow: 0 16px 40px -14px rgba(233,170,80,.6); animation: pop .5s var(--ease); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 10px; }

.appt { padding: 16px 0; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.appt .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.appt .when { font-weight: 800; font-size: 17px; }
.appt .svcs { color: var(--ink-2); font-size: 15px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--brass-soft); color: var(--brass-hi); }
.badge.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }

.profile-cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 30%, var(--ground)); }
.profile-head { display: flex; align-items: flex-end; gap: 14px; margin-top: -44px; position: relative; }
.profile-head img { width: 96px; height: 96px; border-radius: 50%; border: 3px solid var(--ground); box-shadow: 0 0 0 1px var(--line-strong); }
.profile-head h1 { font-family: var(--font-title); font-size: 24px; margin: 0 0 4px; line-height: 1.2; }
.socials { display: flex; gap: 8px; margin-top: 14px; }
.socials a { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; border: 1px solid var(--line-strong); color: var(--ink-2); }
.socials a:hover { color: var(--brass-hi); border-color: var(--brass); }
.gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.gallery div { aspect-ratio: 1; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink-3); }
.price-table { width: 100%; border-collapse: collapse; font-size: 15px; }
.price-table td { padding: 10px 0; border-bottom: 1px solid var(--line); }
.price-table td:last-child { text-align: end; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

.course-hero { margin: 0 -16px; padding: 22px 16px; background: linear-gradient(to bottom, var(--brass-wash), transparent); border-bottom: 1px solid var(--line); }
.course-hero h1 { font-family: var(--font-title); font-size: 26px; margin: 0 0 8px; line-height: 1.2; }
.cohort { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); margin-bottom: 8px; width: 100%; text-align: start; }
.cohort[aria-pressed="true"] { border-color: var(--brass); background: var(--brass-wash); }
.cohort[disabled] { opacity: .5; }
.seats { margin-inline-start: auto; font-size: 13px; color: var(--ink-2); }

/* ---------- staff shell ---------- */
.staff { display: grid; grid-template-columns: 232px 1fr; min-height: calc(100dvh - 55px); }
.rail { background: var(--ground-2); border-inline-end: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; }
.rail .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.rail .brand img { width: 40px; height: 40px; border-radius: 50%; }
.rail .brand b { font-size: 15px; line-height: 1.2; }
.rail .brand small { display: block; color: var(--ink-3); font-weight: 500; font-size: 12px; }
.rail button { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; border-radius: 10px; background: none; color: var(--ink-2); font-weight: 600; text-align: start; }
.rail button:hover { color: var(--ink); background: var(--brass-wash); }
.rail button[aria-current="page"] { background: var(--brass-soft); color: var(--ink); }
.rail button[aria-current="page"] .ic { color: var(--brass-hi); }
.rail .who { margin-top: auto; padding: 12px; font-size: 13px; color: var(--ink-3); border-top: 1px solid var(--line); }
.work { min-width: 0; padding: 18px 24px 40px; position: relative; }
.work-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.work-head h1 { font-family: var(--font-title); font-size: 24px; margin: 0; }
.work-head .spacer { margin-inline-start: auto; }

.notice {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin-bottom: 16px;
  border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface);
}
.notice .ic { color: var(--brass-hi); }
.notice p { margin: 0; flex: 1; }
.notice p b { display: block; }
.notice p span { color: var(--ink-2); font-size: 14px; }

/* week calendar */
.cal-wrap { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: auto; max-height: calc(100dvh - 250px); }
.cal {
  display: grid; grid-template-columns: 56px repeat(6, minmax(130px, 1fr));
  grid-template-rows: 48px repeat(36, 22px); position: relative; min-width: 880px;
}
.cal .dh { position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--line-strong); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.cal .dh small { display: block; color: var(--ink-3); font-weight: 600; font-size: 12px; text-align: center; }
.cal .dh.today { color: var(--brass-hi); }
.cal .dh.closed { color: var(--ink-3); }
.cal .tg { font-size: 12px; color: var(--ink-3); text-align: center; transform: translateY(-8px); font-variant-numeric: tabular-nums; }
.cal .cell { border-top: 1px solid var(--line); border-inline-start: 1px solid var(--line); }
.cal .cell.half { border-top-color: transparent; }
.cal .cell.closed { background: repeating-linear-gradient(-45deg, transparent 0 8px, var(--brass-wash) 8px 9px); }
.cal .cell:hover:not(.closed) { background: var(--brass-wash); cursor: copy; }
.ev {
  position: relative; z-index: 2; margin: 1px 4px; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden;
  text-align: start; border: 0; padding: 0; background: none; color: var(--ink); box-shadow: var(--shadow);
  transition: transform .15s var(--ease);
}
.ev:hover { transform: translateY(-1px); }
.ev .seg-w { background: var(--brass); }
.ev .lbl { position: absolute; top: 0; inset-inline: 0; padding: 3px 8px 4px; background: var(--brass); color: var(--brass-ink); font-size: 12px; line-height: 1.3; border-radius: 8px 8px 0 0; }
.ev .lbl b { font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev .lbl > span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev.short .lbl { display: flex; gap: 6px; align-items: baseline; padding-block: 2px; }
.ev.short .lbl > span { display: inline; }
.ev.short .lbl b { flex: none; max-width: 70%; }
.ev.short .lbl > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ev .seg-p { background: var(--wait); border-inline: 1px dashed var(--brass); color: var(--brass-hi); font-size: 11px; font-weight: 700; display: grid; place-items: end center; padding-bottom: 4px; }
.ev.done .seg-w, .ev.done .lbl { background: var(--surface-2); color: var(--ink-2); }
.ev.done { box-shadow: none; outline: 1px solid var(--line-strong); }
.ev.fill .seg-w, .ev.fill .lbl { background: var(--brass-hi); }
.now-line { position: absolute; inset-inline: 56px 0; height: 0; border-top: 2px solid var(--danger); z-index: 4; pointer-events: none; }

/* side sheet (checkout) */
.sheet-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 60; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  position: fixed; top: 0; bottom: 0; inset-inline-end: 0; width: min(440px, 100%); z-index: 61;
  background: var(--ground-2); border-inline-start: 1px solid var(--line-strong); display: flex; flex-direction: column;
  animation: slide .28s var(--ease); box-shadow: var(--shadow);
}
@keyframes slide { from { transform: translateX(-24px); opacity: 0; } }
.sheet header { display: flex; align-items: center; gap: 10px; padding: 16px; border-bottom: 1px solid var(--line); }
.sheet header h2 { margin: 0; font-size: 19px; font-weight: 800; flex: 1; }
.sheet .scroll { flex: 1; overflow: auto; padding: 16px; display: grid; gap: 16px; align-content: start; }
.sheet footer { padding: 14px 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.line-item { display: grid; grid-template-columns: 1fr 112px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.line-item .input { min-height: 40px; text-align: end; font-variant-numeric: tabular-nums; }
.pay-methods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pay-methods button { min-height: 56px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; gap: 2px; font-size: 13px; font-weight: 700; color: var(--ink-2); padding: 6px; }
.pay-methods button[aria-pressed="true"] { border-color: var(--brass); background: var(--brass-soft); color: var(--ink); }
.pinpad-state { display: grid; justify-items: center; gap: 10px; padding: 24px 12px; text-align: center; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); }
.pinpad-state .pulse { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--brass-soft); color: var(--brass-hi); animation: pulse 1.4s var(--ease) infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 14px transparent, 0 0 0 0 var(--brass-soft); transform: scale(1.04); } }
.total-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 18px; font-weight: 800; }
.total-row .num { font-size: 26px; }

/* tables */
.table { width: 100%; border-collapse: collapse; font-size: 15px; }
.table th { text-align: start; font-size: 13px; color: var(--ink-3); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.table td { padding: 12px; border-bottom: 1px solid var(--line); }
.table tr:hover td { background: var(--brass-wash); }
.table td.n, .table th.n { text-align: end; font-variant-numeric: tabular-nums; white-space: nowrap; }
.table tfoot td { font-weight: 800; border-bottom: 0; border-top: 1px solid var(--line-strong); }
.card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.card-pad { padding: 16px; }
.grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: start; }
.searchbox { position: relative; width: min(340px, 100%); }
.searchbox .ic { position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.searchbox .input { padding-inline-start: 40px; min-height: 42px; }
.client-row { cursor: pointer; }

/* toast */
#toast { position: fixed; inset-inline: 0; bottom: 96px; display: flex; justify-content: center; pointer-events: none; z-index: 80; }
#toast div { background: var(--ink); color: var(--ground); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; box-shadow: var(--shadow); animation: rise .25s var(--ease); }

/* responsive staff */
@media (max-width: 860px) {
  .staff { grid-template-columns: 1fr; }
  .rail { flex-direction: row; position: sticky; top: 55px; z-index: 20; padding: 8px; gap: 4px; overflow-x: auto; border-inline-end: 0; border-bottom: 1px solid var(--line); }
  .rail .brand, .rail .who { display: none; }
  .rail button { white-space: nowrap; padding: 8px 12px; }
  .work { padding: 14px 12px 40px; }
  .grid-2 { grid-template-columns: 1fr; }
  .cal-wrap { max-height: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ROI Marcel Assaraf — clickable demo. Plain JS, no build step. */
(() => {
  const B = window.BIZ, SV = window.SERVICES, ST = window.STYLISTS;
  const byId = Object.fromEntries(SV.map(s => [s.id, s]));
  const $app = document.getElementById("app");
  const DAY = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];
  const DAY_S = ["א׳", "ב׳", "ג׳", "ד׳", "ה׳", "ו׳", "ש׳"];
  const MON = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];

  // ---------- helpers ----------
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ic = (n, cls = "") => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
  const hm = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
  const money = n => n === 0 ? "ללא עלות" : `${n.toLocaleString("he-IL")} ₪`;
  const dur = m => m < 60 ? `${m} דק׳` : (m % 60 ? `${Math.floor(m / 60)} ש׳ ${m % 60} דק׳` : (m === 60 ? "שעה" : m === 120 ? "שעתיים" : `${m / 60} שעות`));
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const longDate = s => { const d = parse(s); return `יום ${DAY[d.getDay()]}, ${d.getDate()} ב${MON[d.getMonth()]}`; };
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const nowMin = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
  const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  const rng = seed => () => ((seed = Math.imul(seed ^ (seed >>> 15), 2246822507) ^ Math.imul(seed ^ (seed >>> 13), 3266489909)) >>> 0) / 4294967296;
  const isOpen = d => d.getDay() <= 4; // Sun–Thu. Friday opens only when the owner opens it.

  // Service plan: processing services first, one blow-dry at the end, optional consult first.
  function plan(ids, addon) {
    const list = ids.map(id => byId[id]).sort((a, b) => hasP(b) - hasP(a));
    let steps = [];
    if (addon) steps.push(["w", window.ADDON.minutes, "addon"]);
    list.forEach(s => s.steps.forEach(st => steps.push([...st, s.id])));
    const blows = steps.filter(st => st[2] === "blow");
    let merged = false;
    if (blows.length > 1) { merged = true; const last = blows[blows.length - 1]; steps = steps.filter(st => st[2] !== "blow" || st === last); }
    const total = steps.reduce((a, st) => a + st[1], 0);
    const wait = steps.filter(st => st[0] === "p").reduce((a, st) => a + st[1], 0);
    const price = list.reduce((a, s) => a + s.price, 0);
    return { list, steps, total, wait, work: total - wait, price, from: list.some(s => s.from), merged };
  }
  const hasP = s => s.steps.some(st => st[0] === "p") ? 1 : 0;
  const ribbon = steps => `<div class="ribbon" role="img" aria-label="זמן בכיסא וזמני המתנה">${steps.map(st => `<b class="${st[0] === "p" ? "p" : ""}" style="flex:${st[1]}"></b>`).join("")}</div>`;
  const legend = p => `<div class="ribbon-legend"><span><i></i>בכיסא ${dur(p.work)}</span>${p.wait ? `<span><i class="p"></i>הצבע נספג ${dur(p.wait)}</span>` : ""}<span>${ic("clock", "sm")}סה״כ ${dur(p.total)}</span></div>`;

  // Busy work-intervals per date (synthetic), plus appointments booked in this session.
  function busy(dateStr) {
    const r = rng(hash(dateStr)), out = [];
    let t = 600 + Math.floor(r() * 4) * 15;
    while (t < 1100) {
      const len = [20, 30, 45, 60, 75][Math.floor(r() * 5)];
      if (r() > .35) out.push([t, t + len]);
      t += len + Math.floor(r() * 5) * 15;
    }
    S.appts.filter(a => a.date === dateStr && a.status === "booked").forEach(a => {
      let off = a.start; plan(a.svc, a.addon).steps.forEach(st => { if (st[0] === "w") out.push([off, off + st[1]]); off += st[1]; });
    });
    return out;
  }
  function slots(dateStr, p) {
    const d = parse(dateStr); if (!isOpen(d)) return [];
    const bz = busy(dateStr), out = [];
    const min = dateStr === ymd(today) ? nowMin() + 60 : 0;
    for (let t = B.open.from; t + p.total <= B.open.to; t += 15) {
      if (t < min) continue;
      let off = t, ok = true;
      for (const st of p.steps) { if (st[0] === "w" && bz.some(([a, b]) => off < b && off + st[1] > a)) { ok = false; break; } off += st[1]; }
      if (ok) out.push(t);
    }
    return out;
  }

  // ---------- state ----------

  const WEEK = [

  const weekStart = (() => { const d = new Date(today); d.setDate(d.getDate() - d.getDay()); return d; })();
  const weekEvents = () => WEEK.map((w, i) => ({ i, day: w[0], start: w[1], svc: w[2], cust: window.CUSTOMERS.find(c => c.id === w[3]), status: S.st.paid?.[i] ? "done" : w[4] }));
  function calView() {
    const ROW0 = 2, SLOT = 5, rows = (B.open.to - B.open.from) / SLOT;
    const ev = weekEvents();
    const days = Array.from({ length: 6 }, (_, i) => { const d = new Date(weekStart); d.setDate(d.getDate() + i); return d; });
    let cells = "";
    days.forEach((d, i) => {
      const closed = !isOpen(d), istoday = d.toDateString() === today.toDateString();
      cells += `<div class="dh ${istoday ? "today" : ""} ${closed ? "closed" : ""}" style="grid-column:${i + 2};grid-row:1">${DAY[d.getDay()]}<small>${closed ? "סגור" : `${d.getDate()}.${d.getMonth() + 1}`}</small></div>`;
      for (let r = 0; r < rows; r += 3) cells += `<div class="cell ${closed ? "closed" : ""} ${(r / 3) % 2 ? "half" : ""}" style="grid-column:${i + 2};grid-row:${ROW0 + r} / span 3" ${closed ? "" : `data-action="toast" data-v="בגרסה המלאה: קביעת תור ידנית ל-${DAY[d.getDay()]} ${hm(B.open.from + r * SLOT)}"`}></div>`;
    });
    for (let r = 0; r < rows; r += 12) cells += `<div class="tg" style="grid-column:1;grid-row:${ROW0 + r}">${hm(B.open.from + r * SLOT)}</div>`;
    const blocks = ev.map(e => {
      const p = plan(e.svc), fill = ev.some(o => o !== e && o.day === e.day && hasWaitCover(o, e));
      const segs = p.steps.reduce((acc, st) => { const last = acc[acc.length - 1]; if (last && last[0] === st[0]) last[1] += st[1]; else acc.push([st[0], st[1]]); return acc; }, []);
      return `<button class="ev ${e.status === "done" ? "done" : ""} ${fill ? "fill" : ""} ${p.total <= 30 ? "short" : ""}" data-action="open-sheet" data-v="${e.i}" style="grid-column:${e.day + 2};grid-row:${ROW0 + (e.start - B.open.from) / SLOT} / span ${p.total / SLOT};${fill ? "margin-inline-start:26%;" : ""}" aria-label="${esc(e.cust.name)}, ${hm(e.start)}, ${p.list.map(s => s.name).join(", ")}${e.status === "done" ? ", שולם" : ""}">
        ${segs.map(s => s[0] === "p" ? `<span class="seg-p" style="flex:${s[1]}">${s[1] >= 30 ? "המתנה · פנוי" : ""}</span>` : `<span class="seg-w" style="flex:${s[1]}"></span>`).join("")}
        <span class="lbl"><b>${esc(e.cust.name)}</b><span><span class="num">${hm(e.start)}</span> · ${esc(p.list.map(x => x.name).join(" + "))}</span></span>

    }).join("");
    const nm = nowMin(), todayIdx = today.getDay();

    const prevMonth = MON[(today.getMonth() + 11) % 12];
    return `<div class="work-head"><h1>השבוע</h1><span class="hint">${weekStart.getDate()}–${days[5].getDate()} ב${MON[days[5].getMonth()]}</span><span class="spacer"></span>

  function hasWaitCover(o, e) { // is e inside o's processing gap?

  function sheet() {

      body = `<div class="pinpad-state"><div class="seal" style="width:64px;height:64px">${ic("check", "lg")}</div><b>שולם · ${money(done && st.pin !== "done" ? sub : total)}</b><span class="hint">קבלה מס׳ 0${142 + e.i} הופקה ונשלחה ב-SMS ל-${esc(e.cust.phone)}</span></div>`;
    } else if (st.pin === "wait") {
      body = `<div class="pinpad-state"><div class="pulse">${ic("pinpad", "lg")}</div><b>ממתין לתשלום במסוף</b><span class="hint">הסכום ${money(total)} נשלח למסוף${st.method === "card" && st.inst > 1 ? ` · ${st.inst} תשלומים` : ""}. הלקוח מעביר כרטיס או מצמיד טלפון.</span><button class="btn sm ghost" data-action="pin-cancel">ביטול</button></div>`;
    } else {
      body = `<section><h3 class="cat" style="margin-top:0">שירותים</h3>
        ${p.list.map(s => `<div class="line-item"><span>${esc(s.name)}${s.from ? `<br><span class="hint">מחיר החל מ־${s.price} ₪. אפשר לעדכן למחיר הסופי</span>` : ""}</span><input class="input" inputmode="numeric" aria-label="מחיר ${esc(s.name)}" data-price="${s.id}" value="${price(s)}"></div>`).join("")}</section>
        <section><h3 class="cat" style="margin-top:0">הנחה</h3><div class="chip-row">
          <button class="chip" data-action="disc" data-v="0" aria-pressed="${!st.discount}">ללא</button>
          ${bday ? `<button class="chip" data-action="disc" data-v="bday" aria-pressed="${st.discount === "bday"}">${ic("gift", "sm")}יום הולדת 10%</button>` : ""}
          ${[20, 50].map(n => `<button class="chip" data-action="disc" data-v="${n}" aria-pressed="${st.discount == n}">₪${n}</button>`).join("")}</div>
          ${bday ? `<p class="hint">ל${esc(e.cust.name)} יש יום הולדת השבוע. ההטבה בתוקף עד שבוע אחרי.</p>` : ""}</section>
        <section><h3 class="cat" style="margin-top:0">טיפ לרועי</h3><div class="chip-row">${[0, 20, 30, 50].map(n => `<button class="chip" data-action="tip" data-v="${n}" aria-pressed="${st.tip == n}">${n ? `₪${n}` : "ללא"}</button>`).join("")}</div></section>
        <section><h3 class="cat" style="margin-top:0">אמצעי תשלום</h3><div class="pay-methods">${methods.map(([k, l, i]) => `<button data-action="method" data-v="${k}" aria-pressed="${st.method === k}">${ic(i)}${l}</button>`).join("")}</div>
          ${st.method === "card" ? `<label class="field" style="margin-top:10px"><span>תשלומים</span><select class="select input" data-inst>${[1, 2, 3, 4, 5].map(n => `<option value="${n}" ${st.inst == n ? "selected" : ""}>${n === 1 ? "תשלום אחד" : `${n} תשלומים`}</option>`).join("")}</select></label>` : ""}</section>`;
    }
    const foot = done || st.pin === "done" ? `<button class="btn primary block" data-action="close-sheet">סגירה</button>`
      : st.pin === "wait" ? "" : `<div class="total-row"><span>לתשלום</span><span class="num">${money(total)}</span></div>
        <button class="btn primary block" data-action="charge">${st.method === "cash" ? `${ic("receipt")}רישום מזומן והפקת קבלה` : `${ic("pinpad")}שליחת הסכום למסוף`}</button>`;
    return `<div class="sheet-scrim" data-action="close-sheet"></div><aside class="sheet" role="dialog" aria-label="סגירת תור">
      <header><h2>${esc(e.cust.name)}</h2><span class="hint num">${DAY[e.day]} · ${hm(e.start)}</span><button class="icon-btn" data-action="close-sheet" aria-label="סגירה">${ic("x")}</button></header>
      <div class="scroll"><div class="chip-row"><a class="btn sm" href="https://wa.me/972${e.cust.phone.replace(/\D/g, "").slice(1)}" target="_blank" rel="noopener">${ic("wa", "sm")}וואטסאפ</a><button class="btn sm ghost" data-action="open-client" data-v="${e.cust.id}">כרטיס לקוח</button></div>
      <div>${ribbon(p.steps)}${legend(p)}</div>${body}</div>${foot ? `<footer>${foot}</footer>` : ""}</aside>`;
  }
  function clientsView() {
    const q = S.st.q.trim();
    const list = window.CUSTOMERS.filter(c => !q || c.name.includes(q) || c.phone.replace(/\D/g, "").includes(q.replace(/\D/g, "") || "§"));
    return `<div class="work-head"><h1>לקוחות</h1><span class="hint">${window.CUSTOMERS.length} לקוחות לדוגמה · בגרסה המלאה 812 לקוחות מיובאים</span><span class="spacer"></span>
      <label class="searchbox">${ic("search", "sm")}<input class="input" placeholder="חיפוש לפי שם או טלפון" data-q value="${esc(S.st.q)}" aria-label="חיפוש לקוח"></label>
      <button class="btn sm primary" data-action="toast" data-v="בגרסה המלאה: הוספת לקוח בשם וטלפון">${ic("plus", "sm")}לקוח חדש</button></div>
      <div class="card" style="overflow:auto">${list.length ? `<table class="table"><thead><tr><th>שם</th><th>טלפון</th><th class="n">ביקורים</th><th>ביקור אחרון</th></tr></thead><tbody>
      ${list.map(c => `<tr class="client-row" data-action="open-client" data-v="${c.id}" tabindex="0"><td><b>${esc(c.name)}</b></td><td class="num">${esc(c.phone)}</td><td class="n">${c.visits}</td><td class="num">${c.last}</td></tr>`).join("")}</tbody></table>`
      : `<div class="empty" style="margin:16px">${ic("search", "lg")}<strong>לא נמצא לקוח בשם "${esc(q)}"</strong><span>אפשר לחפש גם לפי חלק ממספר הטלפון.</span></div>`}</div>`;
  }
  function clientCard() {
    const c = window.CUSTOMERS.find(x => x.id === S.st.client);
    const hist = WEEK.filter(w => w[3] === c.id).map(w => ({ d: `${DAY[w[0]]} השבוע`, t: hm(w[1]), s: w[2].map(id => byId[id].name).join(" + ") }))
      .concat([{ d: c.last, t: "11:00", s: "תספורת נשים + פן" }, { d: "14.09.2026", t: "16:30", s: "צבע שורש" }]);
    return `<div class="work-head"><button class="icon-btn" data-action="st-go" data-v="clients" aria-label="חזרה">${ic("back")}</button><h1>${esc(c.name)}</h1><span class="spacer"></span>
      <a class="btn sm" href="https://wa.me/972${c.phone.replace(/\D/g, "").slice(1)}" target="_blank" rel="noopener">${ic("wa", "sm")}וואטסאפ</a><a class="btn sm" href="tel:${c.phone}">${ic("phone", "sm")}חיוג</a>
      <button class="btn sm primary" data-action="toast" data-v="בגרסה המלאה: קביעת תור ל${esc(c.name)}">${ic("calplus", "sm")}קביעת תור</button></div>
      <div class="grid-2"><div class="card"><table class="table"><thead><tr><th>תאריך</th><th>שעה</th><th>שירותים</th></tr></thead><tbody>${hist.map(h => `<tr><td class="num">${h.d}</td><td class="num">${h.t}</td><td>${esc(h.s)}</td></tr>`).join("")}</tbody></table></div>
      <div class="card card-pad"><dl><div class="kv"><dt>טלפון</dt><dd>${esc(c.phone)}</dd></div><div class="kv"><dt>ביקורים</dt><dd>${c.visits}</dd></div><div class="kv"><dt>ביקור אחרון</dt><dd>${c.last}</dd></div><div class="kv"><dt>סה״כ הוצאה</dt><dd>${money(c.spent)}</dd></div><div class="kv"><dt>אי-הגעות</dt><dd>0</dd></div></dl>
      <div class="toggle" style="margin-top:6px"><span><b>חסימת קביעה עצמית</b><br><span class="hint">הלקוח יופנה לוואטסאפ</span></span><button class="switch" role="switch" aria-checked="false" aria-label="חסימת לקוח" data-action="toggle-sw"></button></div></div></div>`;
  }
  function reportsView() {
    const pm = MON[(today.getMonth() + 11) % 12], yr = today.getMonth() === 0 ? today.getFullYear() - 1 : today.getFullYear();
    const rows = [["אשראי", 118, 31420], ["ביט", 41, 6150], ["Google Pay", 12, 2380], ["PayBox", 6, 820], ["מזומן", 23, 3100]];
    const sum = rows.reduce((a, r) => a + r[2], 0), cnt = rows.reduce((a, r) => a + r[1], 0);
    return `<div class="work-head"><h1>דוחות</h1><span class="spacer"></span><select class="select input" style="width:auto;min-height:42px" aria-label="תקופה"><option>${pm} ${yr}</option><option>רבעון 3 · ${yr}</option><option>שנת ${yr - 1}</option></select></div>
      <div class="grid-2"><div class="card" style="overflow:auto"><table class="table"><thead><tr><th>אמצעי תשלום</th><th class="n">קבלות</th><th class="n">סכום</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td>${r[0]}</td><td class="n">${r[1]}</td><td class="n">${money(r[2])}</td></tr>`).join("")}</tbody>
        <tfoot><tr><td>סה״כ ${pm}</td><td class="n">${cnt}</td><td class="n">${money(sum)}</td></tr></tfoot></table>
        <p class="hint" style="padding:0 12px 12px">נתונים לדוגמה. כולל טיפים (₪1,460) וקבלה אחת שבוטלה.</p></div>
      <div class="card card-pad"><h2 style="margin:0 0 6px;font-size:18px">שליחה לרואה החשבון</h2>
        <p class="hint" style="margin:0 0 14px">PDF מסכם, אקסל מפורט וקובץ ZIP עם כל ${cnt} הקבלות של ${pm}.</p>
        <dl><div class="kv"><dt>נשלח אל</dt><dd>accountant@example.com</dd></div><div class="kv"><dt>סטטוס</dt><dd>${S.st.sent ? `<span class="badge ok">נשלח</span>` : `<span class="badge warn">ממתין</span>`}</dd></div></dl>
        <div style="display:grid;gap:8px;margin-top:14px"><button class="btn primary" data-action="send-report" ${S.st.sent ? "disabled" : ""}>${ic("send")}${S.st.sent ? "הדוח נשלח" : "שליחה לרואה החשבון"}</button>
        <button class="btn" data-action="toast" data-v="בגרסה המלאה: הורדת אקסל">ייצוא לאקסל</button></div></div></div>`;
  }

  // ---------- render & events ----------
  function render(scrollTop) {
    document.documentElement.dataset.theme = S.theme;
    document.querySelector('meta[name="theme-color"]').content = S.theme === "dark" ? "#0E0B08" : "#F3ECE1";
    document.querySelectorAll(".demo-bar [data-action=mode]").forEach(b => b.setAttribute("aria-selected", b.dataset.v === S.mode));
    document.querySelector(".demo-bar [data-action=theme] use").setAttribute("href", S.theme === "dark" ? "#i-sun" : "#i-moon");
    const keep = document.activeElement?.matches?.("[data-q]") ? document.activeElement.selectionStart : null;
    $app.innerHTML = S.mode === "client" ? clientView() : staffView();
    if (keep != null) { const q = $app.querySelector("[data-q]"); q.focus(); q.setSelectionRange(keep, keep); }
    if (scrollTop) window.scrollTo({ top: 0 });
  }
  let toastT;
  function toast(msg) { const t = document.getElementById("toast"); t.innerHTML = `<div>${esc(msg)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => (t.innerHTML = ""), 2600); }
  const phoneOk = p => /^05\d{8}$/.test(p.replace(/\D/g, ""));

  const A = {
    mode: v => { S.mode = v; render(true); },
    theme: () => { S.theme = S.theme === "dark" ? "light" : "dark"; try { localStorage.setItem("roi-theme", S.theme); } catch (e) {} render(); },
    toast: v => toast(v),
    go: v => { if (v === "book" && S.route !== "book") S.b = freshBooking(); S.route = v; S.confirmCancel = null; render(true); },
    "go-home": () => A.go("home"),
    stylist: () => { S.route = "stylist"; render(true); },
    course: () => { S.route = "course"; render(true); },
    svc: v => { const s = S.b.svc; S.b.svc = s.includes(v) ? s.filter(x => x !== v) : [...s, v]; S.b.time = null; S.b.date = null; render(); },
    addon: () => { S.b.addon = !S.b.addon; S.b.time = null; S.b.date = null; render(); },
    "pick-stylist": v => { S.b.stylist = v; render(); },
    date: v => { S.b.date = v; S.b.time = null; render(); },
    time: v => { S.b.time = Number(v); render(); },
    waitmode: v => { S.b.waitMode = v; render(); },
    waitlist: () => { S.appts.push({ id: Date.now(), date: S.b.date, svc: S.b.svc, addon: S.b.addon, status: "waitlist", waitMode: S.b.waitMode }); toast("נרשמת לרשימת ההמתנה"); S.route = "appts"; render(true); },
    for: v => { S.b.forOther = v === "other"; render(); },
    recurring: () => { S.b.recurring = !S.b.recurring; render(); },
    every: v => { S.b.every = Number(v); render(); },
    prev: () => { S.b.step--; render(true); },
    next: () => {
      const b = S.b;
      if (b.step === 3 && b.forOther) {
        b.errors = { oName: !b.oName.trim(), oPhone: !phoneOk(b.oPhone) };
        if (b.errors.oName || b.errors.oPhone) { render(); $app.querySelector("[aria-invalid=true]")?.focus(); return; }
      }
      b.step++; render(true);
    },
    confirm: () => {
      S.b.busy = true; render();
      setTimeout(() => {
        const b = S.b, a = { id: Date.now(), date: b.date, start: b.time, svc: b.svc, addon: b.addon, stylist: b.stylist, status: "booked", forPhone: b.forOther ? b.oPhone : "" };
        if (S.appts.some(x => x.status === "booked" && x.date === a.date && x.start === a.start)) { b.busy = false; toast("התור נתפס הרגע. בחר שעה אחרת."); b.step = 2; b.time = null; render(true); return; }
        S.appts.push(a); S.lastBooked = a; S.b = freshBooking(); S.route = "success"; render(true);
      }, 700);
    },
    ics: () => {
      const a = S.lastBooked, p = plan(a.svc, a.addon), d = a.date.replace(/-/g, "");
      const t = m => `${d}T${hm(m).replace(":", "")}00`;
      const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//ROI Marcel Assaraf//Demo//HE", "BEGIN:VEVENT", `UID:${a.id}@roi-demo`, `DTSTART;TZID=Asia/Jerusalem:${t(a.start)}`, `DTEND;TZID=Asia/Jerusalem:${t(a.start + p.total)}`,
        `SUMMARY:תור אצל רועי מרסל אסרף`, `LOCATION:${B.address}`, `DESCRIPTION:${p.list.map(s => s.name).join(", ")}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
      const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
      Object.assign(document.createElement("a"), { href: url, download: "roi-appointment.ics" }).click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    },
    share: async () => { const txt = `קבעתי תור אצל רועי מרסל אסרף: ${longDate(S.lastBooked.date)} ${hm(S.lastBooked.start)}`; try { if (navigator.share) await navigator.share({ text: txt }); else { await navigator.clipboard.writeText(txt); toast("הועתק"); } } catch (e) {} },
    cancel: v => { const a = S.appts.find(x => x.id == v); if (a.status === "waitlist") { a.status = "cancelled"; toast("יצאת מרשימת ההמתנה"); } else S.confirmCancel = a.id; render(); },
    "cancel-yes": v => { S.appts.find(x => x.id == v).status = "cancelled"; S.confirmCancel = null; toast("התור בוטל. נשלח אישור ב-SMS"); render(); },
    "cancel-no": () => { S.confirmCancel = null; render(); },
    reschedule: v => { const a = S.appts.find(x => x.id == v); S.b = freshBooking(); S.b.svc = [...a.svc]; S.b.step = 2; S.route = "book"; toast("בחר מועד חדש. התור הקיים יוחלף רק אחרי האישור"); render(true); },
    marketing: () => { S.me.marketing = !S.me.marketing; render(); },
    cohort: v => { S.course.cohort = v; render(); },
    minor: () => { S.course.minor = !S.course.minor; render(); },
    enroll: () => toast("בגרסה המלאה: מעבר לדף תשלום מאובטח של זד קרדיט"),
    "toggle-sw": (v, el) => el.setAttribute("aria-checked", el.getAttribute("aria-checked") !== "true"),
    // staff
    "st-go": v => { S.st.route = v; render(true); },
    "open-sheet": v => { Object.assign(S.st, { sheet: Number(v), method: "card", inst: 1, discount: 0, tip: 0, pin: "idle", prices: {} }); render(); },
    "close-sheet": () => { S.st.sheet = null; render(); },
    disc: v => { S.st.discount = v === "bday" ? "bday" : Number(v); render(); },
    tip: v => { S.st.tip = Number(v); render(); },
    method: v => { S.st.method = v; render(); },
    charge: () => {
      const st = S.st;
      if (st.method === "cash") { finishPay(); return; }
      st.pin = "wait"; render();
      clearTimeout(A._pt); A._pt = setTimeout(() => { if (S.st.pin === "wait") finishPay(); }, 2400);
    },
    "pin-cancel": () => { S.st.pin = "idle"; render(); },
    "open-client": v => { S.st.client = Number(v); S.st.sheet = null; S.st.route = "client"; render(true); },
    "send-report": () => { S.st.sent = true; toast("הדוח נשלח לרואה החשבון"); render(); },
  };
  function finishPay() { const st = S.st; st.pin = "done"; st.paid = st.paid || {}; st.paid[st.sheet] = true; render(); }

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-action]");
    if (!el || el.disabled || el.tagName === "INPUT") return;
    const fn = A[el.dataset.action]; if (!fn) return;
    if (el.tagName === "A") return;
    e.preventDefault(); fn(el.dataset.v, el);
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && S.st.sheet != null) A["close-sheet"]();
    if (e.key === "Enter" && e.target.matches("tr[data-action]")) A[e.target.dataset.action](e.target.dataset.v);
  });
  document.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.bind) { S.b[t.dataset.bind] = t.value; if (S.b.errors[t.dataset.bind]) { S.b.errors[t.dataset.bind] = false; t.removeAttribute("aria-invalid"); t.nextElementSibling?.classList.contains("err") && t.nextElementSibling.remove(); } }
    if (t.dataset.bindMe) S.me[t.dataset.bindMe] = t.value;
    if (t.matches("[data-q]")) { S.st.q = t.value; render(); }
    if (t.dataset.price) { S.st.prices[t.dataset.price] = t.value.replace(/\D/g, ""); const pos = t.selectionStart; render(); const n = $app.querySelector(`[data-price="${t.dataset.price}"]`); n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} }
  });
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.matches("[data-inst]")) { S.st.inst = Number(t.value); render(); }
    if (t.dataset.action === "photo" && t.files[0]) { S.b.photos.push(URL.createObjectURL(t.files[0])); render(); }
  });

  render();
})();

</script>
</body>
</html>
